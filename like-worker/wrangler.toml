name = "koda-like"
main = "src/index.js"
compatibility_date = "2026-11-01"

# 点赞数据落在这个 D1 数据库(SQLite)。先跑:
#   wrangler d1 create koda-likes
# 把输出里的 database_id 原样填到下面,再建表、部署(见 README.md)。
[[d1_databases]]
binding = "DB"
database_name = "koda-likes"
database_id = "在这里填 wrangler d1 create 输出的 database_id"
