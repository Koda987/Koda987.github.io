<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6a5ef2"/>
      <stop offset="1" stop-color="#4439b3"/>
    </linearGradient>
  </defs>
  <!-- 圆角方块底（品牌紫渐变） -->
